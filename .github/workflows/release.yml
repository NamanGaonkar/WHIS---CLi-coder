name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run check
        continue-on-error: true

      - name: Build
        shell: bash
        env:
          OPENCODE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${OPENCODE_VERSION#v}"
          cd packages/whis
          OPENCODE_VERSION="$VERSION" bun run script/build.ts --single --skip-embed-web-ui

      - name: Package artifacts
        shell: bash
        run: |
          cd packages/whis/dist
          for dir in */; do
            name="${dir%/}"
            if [ -d "$name/bin" ]; then
              if [ "${{ matrix.os }}" = "windows-latest" ]; then
                # zip must land in packages/whis/dist (ONE level up from $name)
                (cd "$name" && 7z a "../whis-${name#whis-}.zip" bin/*)
              else
                (cd "$name" && tar -czf "../whis-${name#whis-}.tar.gz" bin)
              fi
            fi
          done
          ls -la

      - name: Publish legacy-named binaries (for old-whis self-update)
        shell: bash
        run: |
          # Old Go whis (<=0.2.32) self-update downloads:
          #   whis-<goos>-<goarch>[.exe]  (e.g. whis-windows-amd64.exe)
          # Publish the new engine under those same names so every old install
          # upgrades straight to the new WHIS.
          cd packages/whis/dist
          OSARCH="${{ matrix.target }}"   # e.g. windows-x64 | linux-x64 | darwin-arm64
          DIR="whis-${OSARCH}"            # dist dir: whis-windows-x64 etc
          GOOS="${OSARCH%-*}"
          GOARCH="${OSARCH#*-}"
          case "$GOARCH" in x64) GOARCH=amd64 ;; esac
          # NOTE: on non-windows the installer name (whis-<target>) is exactly
          # the build dir name. Copy BOTH binaries out BEFORE removing the dir,
          # otherwise cp nests the binary inside it and the release upload dies
          # with "read whis-<target>: is a directory".
          if [ "$GOOS" = "windows" ]; then
            cp "${DIR}/bin/whis.exe" "whis-${GOOS}-${GOARCH}.exe"    # legacy Go name
            cp "${DIR}/bin/whis.exe" "whis-${OSARCH}.exe"            # installer name
          else
            cp "${DIR}/bin/whis" "whis-${GOOS}-${GOARCH}"            # legacy Go name
            cp "${DIR}/bin/whis" "whis-${OSARCH}"                    # installer name
          fi
          # Remove the build dir in ALL cases: the artifact upload would carry
          # it along and the release upload step would die with
          # "read whis-<target>: is a directory".
          rm -rf "$DIR"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whis-${{ matrix.target }}
          path: |
            packages/whis/dist/*.zip
            packages/whis/dist/*.tar.gz
            packages/whis/dist/whis-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          for f in *.zip *.tar.gz whis-*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Delete existing release (clean re-create)
        run: gh release delete "${{ github.ref_name }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or replace release
        shell: bash
        run: |
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ github.ref_name }}"             --title "whis ${{ github.ref_name }} - made by Naman Gaonkar"             --generate-notes             --latest
          # uploads endpoint needs a few seconds before it will accept assets
          sleep 8
          cd dist
          # Files only - never directories (a stray dir makes gh fail with
          # "is a directory" and abort the whole upload).
          mapfile -t files < <(find . -maxdepth 1 -type f -printf "%f\n" | sort)
          ok=""
          for i in 1 2 3 4 5; do
            if gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber; then ok="yes"; break; fi
            echo "upload attempt $i failed; retrying in 15s..."
            sleep 15
          done
          [ -n "$ok" ] || { echo "all upload attempts failed"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
