name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run check
        continue-on-error: true

      - name: Build
        shell: bash
        env:
          OPENCODE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${OPENCODE_VERSION#v}"
          cd packages/whis
          OPENCODE_VERSION="$VERSION" bun run script/build.ts --single --skip-embed-web-ui

      - name: Package artifacts
        shell: bash
        run: |
          cd packages/whis/dist
          for dir in */; do
            name="${dir%/}"
            if [ -d "$name/bin" ]; then
              if [ "${{ matrix.os }}" = "windows-latest" ]; then
                # zip must land in packages/whis/dist (ONE level up from $name)
                (cd "$name" && 7z a "../whis-${name#whis-}.zip" bin/*)
              else
                (cd "$name" && tar -czf "../whis-${name#whis-}.tar.gz" bin)
              fi
            fi
          done
          ls -la

      - name: Publish legacy-named binaries (for old-whis self-update)
        shell: bash
        run: |
          # Old Go whis (<=0.2.32) self-update downloads:
          #   whis-<goos>-<goarch>[.exe]  (e.g. whis-windows-amd64.exe)
          # Publish the new engine under those same names so every old install
          # upgrades straight to the new WHIS.
          cd packages/whis/dist
          OSARCH="${{ matrix.target }}"   # e.g. windows-x64 | linux-x64 | darwin-arm64
          DIR="whis-${OSARCH}"            # dist dir: whis-windows-x64 etc
          GOOS="${OSARCH%-*}"
          GOARCH="${OSARCH#*-}"
          case "$GOARCH" in x64) GOARCH=amd64 ;; esac
          if [ "$GOOS" = "windows" ]; then
            cp "${DIR}/bin/whis.exe" "whis-${GOOS}-${GOARCH}.exe"    # legacy Go name
            cp "${DIR}/bin/whis.exe" "whis-${OSARCH}.exe"            # installer name
          else
            cp "${DIR}/bin/whis" "whis-${GOOS}-${GOARCH}"            # legacy Go name
            cp "${DIR}/bin/whis" "whis-${OSARCH}"                    # installer name
          fi
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whis-${{ matrix.target }}
          path: |
            packages/whis/dist/*.zip
            packages/whis/dist/*.tar.gz
            packages/whis/dist/whis-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          for f in *.zip *.tar.gz whis-*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Delete existing release (clean re-create)
        run: gh release delete "${{ github.ref_name }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          title: "whis ${{ github.ref_name }} - made by Naman Gaonkar"
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/whis-*
            dist/*.sha256
          generate_release_notes: true
